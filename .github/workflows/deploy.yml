name: Deploy to DayZ Server

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Check Git
        run: |
          Write-Host "Checking Git..."
          git --version
          Write-Host "Git OK!"
        shell: powershell
        
      - name: Manual checkout
        run: |
          cd C:\actions-runner\_work\DZ-The-LionZ-Server\DZ-The-LionZ-Server
          git pull origin main
          Write-Host "Checkout OK!"
        shell: powershell
        
      - name: Copy files to DayZ Server
        run: |
          robocopy "C:\actions-runner\_work\DZ-The-LionZ-Server\DZ-The-LionZ-Server" "D:\SteamLibrary\steamapps\common\DayZServer" *.txt *.bat *.cfg /R:0 /W:0
          Write-Host "Copy completed!"
          exit 0
        shell: powershell
