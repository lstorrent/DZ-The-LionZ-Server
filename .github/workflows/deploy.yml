name: Deploy to DayZ Server

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Test permissions
        run: |
          Write-Host "Testing write permissions..."
          "test" | Out-File "D:\SteamLibrary\steamapps\common\DayZServer\test-runner.txt"
          Write-Host "Permission test OK!"
        shell: powershell
        
      - name: Copy files to DayZ Server
        run: |
          robocopy "${{ github.workspace }}" "D:\SteamLibrary\steamapps\common\DayZServer" *.txt *.bat *.cfg /R:0 /W:0
          Write-Host "Copy completed!"
          exit 0
        shell: powershell
