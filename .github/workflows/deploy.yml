name: Deploy to DayZ Server

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Copy files to DayZ Server
        run: |
          robocopy "${{ github.workspace }}" "D:\SteamLibrary\steamapps\common\DayZServer" /MIR /XD .git .github /XF .gitignore README.md
          if ($LASTEXITCODE -le 7) { exit 0 } else { exit $LASTEXITCODE }
        shell: powershell
